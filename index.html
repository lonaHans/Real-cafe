<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Cafe</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <div class="container">
        <div class="cups">
            <img src="cups.png">
        </div>
        <div class="name">
            <h1>Cappuccino <img src="Vector.png" id="heart"></h1>
            <h3>Drizzled with Caramel <img src="Group 111.png" id="star"></h3>
            <p class="description">A single espresso shot poured into hot foamy milk, with the surface topped with
                mildly sweetened cocoa powder and drizzled with scrumptious caramel syrup.</p>
        </div>
        <div>

            <div class="milk">
                <p>Choice of Milk</p>
                <div class="milk-options">
                    <button>Oat Milk</button>
                    <button>Soy Milk</button>
                    <button>Almond Milk</button>
                </div>

            </div>


            <div class="buy">
                <p class="description">Price
                 <span class="price">₹249</span>
                </p>
                <button>BUY NOW</button>
            </div>
        </div>

</body>

</html>
